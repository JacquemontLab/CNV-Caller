name: Build and Push Multiple GHCR Images

on:
  push:
    branches: [ main, test-ghcr-workflow ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cnv_caller_report
        uses: docker/build-push-action@v6
        with:
          context: .
          file: resources/dockerfiles/Dockerfile_cnv_caller_report
          push: true
          tags: ghcr.io/${{ github.repository_owner.toLowerCase() }}/cnv_caller_report:latest

      - name: Build python_3.11
        uses: docker/build-push-action@v6
        with:
          context: .
          file: resources/dockerfiles/Dockerfile_python_3.11 
          push: true
          tags: ghcr.io/${{ github.repository_owner.toLowerCase() }}/python_3.11:latest

      - name: Build penncnv-quantisnp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: resources/dockerfiles/Dockerfile_penncnv_quantisnp
          push: true
          tags: ghcr.io/${{ github.repository_owner.toLowerCase() }}/penncnv_quantisnp:v2.3
