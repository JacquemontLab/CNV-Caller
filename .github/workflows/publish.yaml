name: Build and Push Multiple GHCR Images

on:
  push:
    branches: [ test-ghcr-workflow ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: test-ghcr-workflow

      - name: Debug list dockerfiles
        run: |
          pwd
          ls ./resources/dockerfiles -la
          git status
          git log -1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build python_etl_packages
        uses: docker/build-push-action@v5
        with:
          context: .
          file: /resources/dockerfiles/Dockerfile_python_etl_packages
          push: true
          tags: ghcr.io/jacquemontlab/python_etl_packages:latest
      
      - name: Build cnv_caller_report
        uses: docker/build-push-action@v5
        with:
          context: .
          file: /resources/dockerfiles/Dockerfile_cnv_caller_report
          push: true
          tags: ghcr.io/jacquemontlab/cnv_caller_report:latest

      - name: Build penncnv-quantisnp
        uses: docker/build-push-action@v5
        with:
          context: .
          file: /resources/dockerfiles/Dockerfile_penncnv_quantisnp
          push: true
          tags: ghcr.io/jacquemontlab/penncnv_quantisnp:v2.3